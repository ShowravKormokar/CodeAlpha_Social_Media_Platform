<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Reset your SocialApp password.">

  <title>Reset Password — SocialApp</title>

  <!-- Remix Icon -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>

<body class="auth-page">

  <main class="auth-screen">

    <!-- Decorative background -->
    <div class="auth-orb auth-orb-one" aria-hidden="true"></div>
    <div class="auth-orb auth-orb-two" aria-hidden="true"></div>
    <div class="auth-orb auth-orb-three" aria-hidden="true"></div>

    <section class="auth-card auth-card-reset" aria-labelledby="reset-title">

      <!-- Brand -->
      <div class="auth-brand">
        <a href="feed.html" class="auth-brand-link" aria-label="SocialApp home">
          <span class="auth-brand-icon" aria-hidden="true">
            <i class="ri-chat-3-fill"></i>
          </span>

          <span class="auth-brand-name">
            SocialApp
          </span>
        </a>
      </div>

      <!-- Header -->
      <header class="auth-header">

        <span class="auth-eyebrow">
          <span class="auth-status-dot" aria-hidden="true"></span>
          Reset password
        </span>

        <h1 id="reset-title">
          Create a new password
        </h1>

        <p>
          Your new password must be different from previously used passwords.
        </p>

      </header>

      <!-- Form -->
      <form id="reset-form" class="auth-form" novalidate aria-busy="false">

        <!-- Hidden token field -->
        <input type="hidden" id="token" name="token">

        <!-- New Password -->
        <div class="form-group">

          <label for="newPassword" class="form-label">
            New password
          </label>

          <div class="auth-input-shell">

            <i class="ri-lock-2-line auth-input-icon" aria-hidden="true"></i>

            <input type="password" id="newPassword" name="newPassword" class="form-input auth-input"
              placeholder="Create a new password" autocomplete="new-password" minlength="8" required>

            <button type="button" class="auth-password-toggle" data-password-toggle="newPassword"
              aria-label="Show password" aria-pressed="false">
              <i class="ri-eye-line" aria-hidden="true"></i>
            </button>

          </div>

        </div>

        <!-- Confirm New Password -->
        <div class="form-group">

          <label for="confirmNewPassword" class="form-label">
            Confirm new password
          </label>

          <div class="auth-input-shell">

            <i class="ri-shield-check-line auth-input-icon" aria-hidden="true"></i>

            <input type="password" id="confirmNewPassword" name="confirmNewPassword" class="form-input auth-input"
              placeholder="Repeat your new password" autocomplete="new-password" required>

            <button type="button" class="auth-password-toggle" data-password-toggle="confirmNewPassword"
              aria-label="Show confirmation password" aria-pressed="false">
              <i class="ri-eye-line" aria-hidden="true"></i>
            </button>

          </div>

        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary auth-submit">
          <span class="auth-submit-default">
            <span>Reset Password</span>
            <i class="ri-arrow-right-line" aria-hidden="true"></i>
          </span>

          <span class="auth-submit-loading" aria-hidden="true">
            <span class="auth-spinner"></span>
            <span>Resetting...</span>
          </span>
        </button>

      </form>

      <!-- Error -->
      <div id="auth-error" class="auth-error" role="alert" aria-live="assertive" hidden></div>

      <!-- Success Message -->
      <div id="auth-success" class="auth-success" role="status" aria-live="polite" hidden></div>

      <!-- Footer -->
      <footer class="auth-footer">
        <p>
          Back to
          <a href="login.html">
            Sign In
          </a>
        </p>
      </footer>

    </section>

  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/pages/reset-password.js"></script>

</body>

</html>
