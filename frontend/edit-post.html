<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Edit your post on SocialApp.">

  <meta name="theme-color" content="#222831">

  <title>Edit Post — SocialApp</title>

  <!-- =====================================================
       ICONS
       ====================================================== -->

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css">

  <!-- =====================================================
       CORE STYLES
       ====================================================== -->

  <link rel="stylesheet" href="css/reset.css">

  <link rel="stylesheet" href="css/variables.css">

  <link rel="stylesheet" href="css/global.css">

  <link rel="stylesheet" href="css/components.css">

  <!-- =====================================================
       PAGE STYLES
       ====================================================== -->

  <link rel="stylesheet" href="css/pages/edit-post.css">
</head>

<body class="edit-post-page">

  <div id="app">

    <!-- ===================================================
         NAVIGATION
         =================================================== -->

    <header class="navbar" id="navbar"></header>


    <!-- ===================================================
         CONTENT LAYOUT
         =================================================== -->

    <div class="layout">

      <!-- ================================================
           MAIN CONTENT
           ================================================= -->

      <main class="main-content" id="main-content">

        <div id="edit-post-root" aria-live="polite">

          <!-- Loading state (visible before JS runs) -->
          <section class="edit-post-card" aria-label="Edit post">
            <div class="edit-post-loading">
              <span class="edit-post-spinner" aria-hidden="true"></span>
              <span>Loading post...</span>
            </div>
          </section>

        </div>

      </main>

    </div>

  </div>


  <!-- =====================================================
       CONFIG
       ====================================================== -->

  <script src="js/config.js"></script>
  <script type="module" src="js/main.js"></script>


  <!-- =====================================================
       PAGE SCRIPT
       ====================================================== -->

  <script type="module" src="js/pages/edit-post.js"></script>

</body>

</html>
