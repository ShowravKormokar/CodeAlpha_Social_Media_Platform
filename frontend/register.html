<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Create your SocialApp account.">

  <title>Create Account — SocialApp</title>

  <!-- Remix Icon -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>

<body class="auth-page">

  <main class="auth-screen">

    <!-- Decorative background -->
    <div class="auth-orb auth-orb-one" aria-hidden="true"></div>
    <div class="auth-orb auth-orb-two" aria-hidden="true"></div>
    <div class="auth-orb auth-orb-three" aria-hidden="true"></div>

    <section class="auth-card auth-card-register" aria-labelledby="register-title">

      <!-- Brand -->
      <div class="auth-brand">
        <a href="/feed.html" class="auth-brand-link" aria-label="SocialApp home">
          <span class="auth-brand-icon" aria-hidden="true">
            <i class="ri-chat-3-fill"></i>
          </span>

          <span class="auth-brand-name">
            SocialApp
          </span>
        </a>
      </div>

      <!-- Header -->
      <header class="auth-header">

        <span class="auth-eyebrow">
          <span class="auth-status-dot" aria-hidden="true"></span>
          Join the community
        </span>

        <h1 id="register-title">
          Create your account
        </h1>

        <p>
          Create your profile and start connecting with your community.
        </p>

      </header>

      <!-- Form -->
      <form id="register-form" class="auth-form auth-register-form" novalidate aria-busy="false">

        <!-- Full Name -->
        <div class="form-group auth-form-full">

          <label for="name" class="form-label">
            Full name
          </label>

          <div class="auth-input-shell">

            <i class="ri-user-3-line auth-input-icon" aria-hidden="true"></i>

            <input type="text" id="name" name="name" class="form-input auth-input" placeholder="Your full name"
              autocomplete="name" maxlength="100">

          </div>

        </div>

        <!-- Username -->
        <div class="form-group">

          <label for="username" class="form-label">
            Username
          </label>

          <div class="auth-input-shell">

            <i class="ri-at-line auth-input-icon" aria-hidden="true"></i>

            <input type="text" id="username" name="username" class="form-input auth-input" placeholder="your_username"
              autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="30"
              pattern="[a-zA-Z0-9_]{3,30}" required>

          </div>

        </div>

        <!-- Email -->
        <div class="form-group auth-form-full">

          <label for="email" class="form-label">
            Email address
          </label>

          <div class="auth-input-shell">

            <i class="ri-mail-line auth-input-icon" aria-hidden="true"></i>

            <input type="email" id="email" name="email" class="form-input auth-input" placeholder="you@example.com"
              autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required>

          </div>

        </div>

        <!-- Password -->
        <div class="form-group">

          <label for="password" class="form-label">
            Password
          </label>

          <div class="auth-input-shell">

            <i class="ri-lock-2-line auth-input-icon" aria-hidden="true"></i>

            <input type="password" id="password" name="password" class="form-input auth-input"
              placeholder="Create a password" autocomplete="new-password" minlength="8" required>

            <button type="button" class="auth-password-toggle" data-password-toggle="password"
              aria-label="Show password" aria-pressed="false">
              <i class="ri-eye-line" aria-hidden="true"></i>
            </button>

          </div>

        </div>

        <!-- Confirm Password -->
        <div class="form-group">

          <label for="confirmPassword" class="form-label">
            Confirm password
          </label>

          <div class="auth-input-shell">

            <i class="ri-shield-check-line auth-input-icon" aria-hidden="true"></i>

            <input type="password" id="confirmPassword" name="confirmPassword" class="form-input auth-input"
              placeholder="Repeat your password" autocomplete="new-password" required>

            <button type="button" class="auth-password-toggle" data-password-toggle="confirmPassword"
              aria-label="Show confirmation password" aria-pressed="false">
              <i class="ri-eye-line" aria-hidden="true"></i>
            </button>

          </div>

        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary auth-submit auth-form-full">
          <span class="auth-submit-default">
            <span>Create Account</span>
            <i class="ri-arrow-right-line" aria-hidden="true"></i>
          </span>

          <span class="auth-submit-loading" aria-hidden="true">
            <span class="auth-spinner"></span>
            <span>Creating account...</span>
          </span>
        </button>

      </form>

      <!-- Error -->
      <div id="auth-error" class="auth-error" role="alert" aria-live="assertive" hidden></div>

      <!-- Footer -->
      <footer class="auth-footer">
        <p>
          Already have an account?
          <a href="login.html">
            Sign in
          </a>
        </p>
      </footer>

    </section>

  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/pages/register.js"></script>

</body>

</html>
