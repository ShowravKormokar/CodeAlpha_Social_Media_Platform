server {
  listen 80;
  listen [::]:80;

  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Absolute asset paths such as `/css/components.css` and
  # `/js/main.js` are used throughout the pages.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # HTML must never be cached, otherwise a redeploy keeps
  # serving stale page references.
  location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
  }

  # Static assets are safe to cache briefly during development.
  location ~* \.(css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=3600";
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml;

  # Do not advertise the nginx version.
  server_tokens off;
}
