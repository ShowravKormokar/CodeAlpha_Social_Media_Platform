<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Reset your SocialApp password.">

  <title>Forgot Password — SocialApp</title>

  <!-- Remix Icon -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>

<body class="auth-page">

  <main class="auth-screen">

    <!-- Decorative background -->
    <div class="auth-orb auth-orb-one" aria-hidden="true"></div>
    <div class="auth-orb auth-orb-two" aria-hidden="true"></div>
    <div class="auth-orb auth-orb-three" aria-hidden="true"></div>

    <section class="auth-card auth-card-forgot" aria-labelledby="forgot-title">

      <!-- Brand -->
      <div class="auth-brand">
        <a href="/feed.html" class="auth-brand-link" aria-label="SocialApp home">
          <span class="auth-brand-icon" aria-hidden="true">
            <i class="ri-chat-3-fill"></i>
          </span>

          <span class="auth-brand-name">
            SocialApp
          </span>
        </a>
      </div>

      <!-- Header -->
      <header class="auth-header">

        <span class="auth-eyebrow">
          <span class="auth-status-dot" aria-hidden="true"></span>
          Reset password
        </span>

        <h1 id="forgot-title">
          Forgot your password?
        </h1>

        <p>
          Enter your email address and we'll send you a link to reset your password.
        </p>

      </header>

      <!-- Form -->
      <form id="forgot-form" class="auth-form" novalidate aria-busy="false">

        <!-- Email -->
        <div class="form-group auth-form-full">

          <label for="email" class="form-label">
            Email address
          </label>

          <div class="auth-input-shell">

            <i class="ri-mail-line auth-input-icon" aria-hidden="true"></i>

            <input type="email" id="email" name="email" class="form-input auth-input" placeholder="you@example.com"
              autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required>

          </div>

        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary auth-submit auth-form-full">
          <span class="auth-submit-default">
            <span>Send reset link</span>
            <i class="ri-arrow-right-line" aria-hidden="true"></i>
          </span>

          <span class="auth-submit-loading" aria-hidden="true">
            <span class="auth-spinner"></span>
            <span>Sending...</span>
          </span>
        </button>

      </form>

      <!-- Error -->
      <div id="auth-error" class="auth-error" role="alert" aria-live="assertive" hidden></div>

      <!-- Success Message -->
      <div id="auth-success" class="auth-success" role="status" aria-live="polite" hidden></div>

      <!-- Footer -->
      <footer class="auth-footer">
        <p>
          Remember your password?
          <a href="login.html">
            Sign in
          </a>
        </p>
      </footer>

    </section>

  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/pages/forgot-password.js"></script>

</body>

</html>
