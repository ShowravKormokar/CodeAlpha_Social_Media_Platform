<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Verify your email address for SocialApp.">

  <title>Verify Email — SocialApp</title>

  <!-- Remix Icon -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>

<body class="auth-page">

  <main class="auth-screen">

    <!-- Decorative background -->
    <div class="auth-orb auth-orb-one" aria-hidden="true"></div>
    <div class="auth-orb auth-orb-two" aria-hidden="true"></div>
    <div class="auth-orb auth-orb-three" aria-hidden="true"></div>

    <section class="auth-card auth-card-verify" aria-labelledby="verify-title">

      <!-- Brand -->
      <div class="auth-brand">
        <a href="feed.html" class="auth-brand-link" aria-label="SocialApp home">
          <span class="auth-brand-icon" aria-hidden="true">
            <i class="ri-chat-3-fill"></i>
          </span>

          <span class="auth-brand-name">
            SocialApp
          </span>
        </a>
      </div>

      <!-- Header -->
      <header class="auth-header">

        <span class="auth-eyebrow">
          <span class="auth-status-dot" aria-hidden="true"></span>
          Verify your email
        </span>

        <h1 id="verify-title">
          Check your inbox
        </h1>

        <p>
          We've sent a verification link to your email address.
          Enter the code below to verify your account.
        </p>

      </header>

      <!-- Form -->
      <form id="verify-form" class="auth-form" novalidate aria-busy="false">

        <!-- Verification Token -->
        <div class="form-group">

          <label for="token" class="form-label">
            Verification code
          </label>

          <div class="auth-input-shell">

            <i class="ri-shield-check-line auth-input-icon" aria-hidden="true"></i>

            <input type="text" id="token" name="token" class="form-input auth-input"
              placeholder="Enter 64-character code" autocomplete="one-time-code" spellcheck="false" required>

          </div>

        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary auth-submit">
          <span class="auth-submit-default">
            <span>Verify Email</span>
            <i class="ri-arrow-right-line" aria-hidden="true"></i>
          </span>

          <span class="auth-submit-loading" aria-hidden="true">
            <span class="auth-spinner"></span>
            <span>Verifying...</span>
          </span>
        </button>

      </form>

      <!-- Resend -->
      <div class="auth-resend">
        <p>Didn't receive the email?
          <button type="button" id="resend-btn" class="auth-resend-link">
            Resend verification
          </button>
        </p>
        <p id="resend-message" class="auth-resend-message" hidden></p>
      </div>

      <!-- Error -->
      <div id="auth-error" class="auth-error" role="alert" aria-live="assertive" hidden></div>

      <!-- Footer -->
      <footer class="auth-footer">
        <p>
          Back to
          <a href="login.html">
            Sign In
          </a>
        </p>
      </footer>

    </section>

  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/pages/verify-email.js"></script>

</body>

</html>
