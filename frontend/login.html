<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Sign in to your SocialApp account.">

  <title>Sign In — SocialApp</title>

  <!-- Remix Icon -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>

<body class="auth-page">

  <main class="auth-screen">

    <!-- Decorative background -->
    <div class="auth-orb auth-orb-one" aria-hidden="true"></div>
    <div class="auth-orb auth-orb-two" aria-hidden="true"></div>
    <div class="auth-orb auth-orb-three" aria-hidden="true"></div>

    <section class="auth-card auth-card-login" aria-labelledby="login-title">

      <!-- Brand -->
      <!-- <div class="auth-brand">
        <a href="/feed.html" class="auth-brand-link" aria-label="SocialApp home">
          <span class="auth-brand-icon" aria-hidden="true">
            <i class="ri-chat-3-fill"></i>
          </span>

          <span class="auth-brand-name">
            SocialApp
          </span>
        </a>
      </div> -->

      <!-- Header -->
      <header class="auth-header">

        <span class="auth-eyebrow">
          <span class="auth-status-dot" aria-hidden="true"></span>
          Welcome back
        </span>

        <h1 id="login-title">
          Sign in to continue
        </h1>

        <p>
          Continue to your SocialApp account and stay connected.
        </p>

      </header>

      <!-- Form -->
      <form id="login-form" class="auth-form" novalidate aria-busy="false">

        <!-- Email / Username -->
        <div class="form-group">

          <label for="emailOrUsername" class="form-label">
            Email or username
          </label>

          <div class="auth-input-shell">

            <i class="ri-user-3-line auth-input-icon" aria-hidden="true"></i>

            <input type="text" id="emailOrUsername" name="emailOrUsername" class="form-input auth-input"
              placeholder="you@example.com" autocomplete="username" autocapitalize="none" spellcheck="false" required>

          </div>

        </div>

        <!-- Password -->
        <div class="form-group">

          <div class="auth-label-row">

            <label for="password" class="form-label">
              Password
            </label>

          </div>

          <div class="auth-input-shell">

            <i class="ri-lock-2-line auth-input-icon" aria-hidden="true"></i>

            <input type="password" id="password" name="password" class="form-input auth-input auth-password-input"
              placeholder="Enter your password" autocomplete="current-password" required>

            <button type="button" class="auth-password-toggle" data-password-toggle="password"
              aria-label="Show password" aria-pressed="false">
              <i class="ri-eye-line" aria-hidden="true"></i>
            </button>

          </div>

        </div>

        <!-- Forgot Password Link -->
        <div class="auth-forgot">
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary auth-submit">
          <span class="auth-submit-default">
            <span>Sign In</span>
            <i class="ri-arrow-right-line" aria-hidden="true"></i>
          </span>

          <span class="auth-submit-loading" aria-hidden="true">
            <span class="auth-spinner"></span>
            <span>Signing in...</span>
          </span>
        </button>

      </form>

      <!-- Error -->
      <div id="auth-error" class="auth-error" role="alert" aria-live="assertive" hidden></div>

      <!-- Footer -->
      <footer class="auth-footer">
        <p>
          Don't have an account?
          <a href="register.html">
            Create one
          </a>
        </p>
      </footer>

    </section>

  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/pages/login.js"></script>

</body>

</html>
