# =========================================================
# Social Media Platform - local development stack
# =========================================================
# One-command startup:
#
#   cp .env.example .env
#   docker compose up -d
#
# Startup order enforced by health-gated dependencies:
#
#   db (healthy) -> migrate (exits 0) -> api (healthy) -> frontend
# =========================================================

# Shared build definition so `api` and `migrate` use the exact
# same image instead of building two different ones.
x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-backend-env: &backend-env
  NODE_ENV: ${NODE_ENV:-production}
  PORT: ${PORT:-5000}

  # Inside the compose network the database is reachable by the
  # service name `db`; `localhost` would point at this container.
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-social_media}

  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me}
  JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-change-me}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

  COOKIE_NAME: ${COOKIE_NAME:-access_token}
  REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refresh_token}

  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5500}

  RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
  RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}


services:

  # ---------------------------------------------------------
  # db - PostgreSQL
  # ---------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: socialapp-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-social_media}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Not published to the host on purpose. Use
    # `docker compose exec db psql -U postgres -d social_media`
    # to reach the database.
    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-social_media}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - socialapp


  # ---------------------------------------------------------
  # migrate - one-shot schema migration
  # ---------------------------------------------------------
  # Runs the project's existing migration runner
  # (`npm run db:migrate`) and exits. A non-zero exit stops the
  # API from starting, so a failed migration is never hidden.
  #
  # Inspect logs with:
  #   docker compose logs migrate
  # ---------------------------------------------------------
  migrate:
    build: *backend-build
    image: socialapp-api:latest
    container_name: socialapp-migrate
    restart: "no"

    environment: *backend-env

    command: ["node", "src/database/migrate.js"]

    depends_on:
      db:
        condition: service_healthy

    networks:
      - socialapp


  # ---------------------------------------------------------
  # api - Express backend
  # ---------------------------------------------------------
  api:
    build: *backend-build
    image: socialapp-api:latest
    container_name: socialapp-api
    restart: unless-stopped

    environment: *backend-env

    ports:
      - "${API_PORT:-5000}:${PORT:-5000}"

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||5000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - socialapp


  # ---------------------------------------------------------
  # frontend - static files served by nginx
  # ---------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: socialapp-frontend:latest
    container_name: socialapp-frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-5500}:80"

    depends_on:
      api:
        condition: service_healthy

    networks:
      - socialapp


volumes:
  postgres_data:

networks:
  socialapp:
    driver: bridge
